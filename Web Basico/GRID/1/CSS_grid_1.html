<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício CSS Grid</title>
    <link rel="stylesheet" href="style_grid_1.css" type="text/css">
</head>
<body>
    <div class="container">
        <div class="item item1">Cabeçalho</div>
        <div class="item item2">Menu</div>
        <div class="item item3">Conteúdo</div>
        <div class="item item4">Informações Extras</div>
        <div class="item item5">Rodapé</div>
    </div>
</body>
</html>
<!--
A estrutura HTML contém uma div principal com a classe .container, que abrigará todos os itens da nossa grade. Cada div dentro da .container representa uma parte do layout (como cabeçalho, menu, conteúdo, etc.).
-->
